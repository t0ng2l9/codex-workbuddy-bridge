# Append to %USERPROFILE%\.codex\config.toml
# (install.cmd writes this automatically; kept here as a reference for manual setup)

[model_providers.wbbridge]
name = "WorkBuddy"
base_url = "http://127.0.0.1:8788/v1"
# The local proxy does not validate the key; a placeholder is fine (the real
# session lives inside the proxy)
experimental_bearer_token = "wbbridge-local"
wire_api = "responses"
requires_openai_auth = false
# The upstream returns 429; allow enough backoff retries
request_max_retries = 6
stream_max_retries = 6
